name: UX refactor test
on:
  push:
    paths:
      - .github/workflows/ux-refactor-test.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "workflow runner OK"
      - name: Remove test workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/ux-refactor-test.yml
          git add .github/workflows/ux-refactor-test.yml
          git commit -m "chore: remove workflow test"
          git push
