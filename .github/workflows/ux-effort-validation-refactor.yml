name: Workout UX refactor

on:
  push:
    paths:
      - .github/workflows/ux-effort-validation-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply UI refactor
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/main.tsx')
          text = path.read_text(encoding='utf-8')

          old_effort = '''function EffortPicker({rir,setRir,fatigue,setFatigue}:{rir:string;setRir:(v:string)=>void;fatigue:string;setFatigue:(v:string)=>void}){
  return <div className="rounded-2xl border border-line bg-panel p-4">
    <div className="grid grid-cols-2 gap-3">
      <label className="block"><span className="field-label">RIR</span><select value={rir} onChange={e=>setRir(e.target.value)}><option value="">—</option>{RIR_OPTIONS.map(v=><option key={v} value={v}>{v}{v===0?" · Nessuna":v===1?" · 1 rep":v===2?" · 2 reps":" · 3+ reps"}</option>)}</select></label>
      <label className="block"><span className="field-label">FATICA</span><select value={fatigue} onChange={e=>setFatigue(e.target.value)}><option value="">—</option>{FATIGUE_OPTIONS.map(v=><option key={v} value={v}>{v}/5 · {fatigueLabel(v)}</option>)}</select></label>
    </div>
  </div>
}'''

          new_effort = '''function EffortPicker({rir,setRir,fatigue,setFatigue}:{rir:string;setRir:(v:string)=>void;fatigue:string;setFatigue:(v:string)=>void}){
  const button=(selected:boolean)=>`min-h-11 rounded-xl border px-2 text-[10px] font-extrabold transition ${selected?"border-violet-400 bg-violet-500/15 text-white":"border-line bg-panel2 text-zinc-500 hover:text-zinc-300"}`;
  return <div className="rounded-2xl border border-line bg-panel p-4">
    <div>
      <span className="field-label">RIR · REPS ANCORA DISPONIBILI</span>
      <div className="mt-2 grid grid-cols-4 gap-2">
        {RIR_OPTIONS.map(v=><button type="button" key={v} className={button(rir===String(v))} aria-pressed={rir===String(v)} onClick={()=>setRir(rir===String(v)?"":String(v))}>{v===3?"3+":v}</button>)}
      </div>
    </div>
    <div className="mt-4 border-t border-line pt-4">
      <span className="field-label">FATICA</span>
      <div className="mt-2 grid grid-cols-5 gap-2">
        {FATIGUE_OPTIONS.map(v=><button type="button" key={v} className={button(fatigue===String(v))} aria-pressed={fatigue===String(v)} onClick={()=>setFatigue(fatigue===String(v)?"":String(v))}>{v}</button>)}
      </div>
      <div className="mt-2 text-center text-[8px] text-zinc-600">1 facile · 5 quasi esausto</div>
    </div>
  </div>
}'''

          if old_effort not in text:
              raise SystemExit('EffortPicker source block not found')
          text = text.replace(old_effort, new_effort, 1)

          start = text.index('function ProgramValidationCard({refresh}:{refresh:number}){')
          end = text.index('\n}\n\nfunction', start) + 2
          old_validation = text[start:end]

          new_validation = '''function ProgramValidationCard({refresh}:{refresh:number}){
 const report:ProgramValidationReport=validateProgramWeek(effectiveProgramMap());
 const [expanded,setExpanded]=useState(false);
 const scoreTone=report.severity==="OK"?"text-emerald-300":report.severity==="WATCH"?"text-amber-300":"text-rose-300";
 const signals=report.signals.slice(0,expanded?12:4);
 const severityLabel=report.severity==="OK"?"SETTIMANA OK":report.severity==="WATCH"?"DA MONITORARE":"ATTENZIONE";
 const totalSets=report.days.reduce((a,d)=>a+d.adjustedSets,0);
 const totalFatigue=report.days.reduce((a,d)=>a+d.fatigueLoad,0);
 const totalGrip=report.days.reduce((a,d)=>a+d.gripScore,0);
 return <div className="mb-5 rounded-2xl border border-violet-500/20 bg-violet-500/5 p-4">
  <div className="flex items-start justify-between gap-3"><div><div className="section-kicker">CONTROLLO DELLA SETTIMANA</div><div className="mt-1 text-sm font-extrabold">Il Coach controlla il programma prima che inizi la settimana</div><p className="mt-1 text-[10px] leading-5 text-zinc-500">Qui verifichiamo volume, recupero, sovrapposizione degli stimoli e ordine degli esercizi. Un avviso indica un punto da monitorare, non una modifica automatica.</p></div><div className="text-right"><div className={`text-lg font-extrabold ${scoreTone}`}>{report.score}</div><div className={`text-[8px] font-bold tracking-[.12em] ${scoreTone}`}>{severityLabel}</div></div></div>
  <div className="mt-4 rounded-xl border border-line bg-panel p-3"><div className="field-label">COSA SIGNIFICA</div><p className="mt-1 text-[10px] leading-5 text-zinc-400">Il punteggio riassume quanto il carico previsto della settimana è gestibile. Il Coach usa questi segnali per decidere se una sessione va tenuta sotto controllo o se il volume va adattato.</p></div>
  <div className="mt-3 grid gap-2 sm:grid-cols-3"><div className="rounded-xl border border-line bg-panel p-3"><div className="field-label">SERIE EFFETTIVE</div><div className="mt-1 text-lg font-extrabold">{totalSets.toFixed(1)}</div></div><div className="rounded-xl border border-line bg-panel p-3"><div className="field-label">CARICO DI FATICA</div><div className="mt-1 text-lg font-extrabold">{totalFatigue.toFixed(1)}</div></div><div className="rounded-xl border border-line bg-panel p-3"><div className="field-label">IMPEGNO DELLA PRESA</div><div className="mt-1 text-lg font-extrabold">{totalGrip.toFixed(1)}</div></div></div>
  <div className="mt-4 grid gap-2">{signals.length?signals.map((s,i)=><div key={`${s.kind}-${s.title}-${i}`} className="rounded-xl border border-line bg-panel2 p-3"><div className="flex items-center justify-between gap-2"><span className={`text-[8px] font-extrabold tracking-[.12em] ${s.severity==="HIGH"?"text-rose-300":s.severity==="WATCH"?"text-amber-300":"text-emerald-300"}`}>{s.severity==="HIGH"?"ATTENZIONE":s.severity==="WATCH"?"DA MONITORARE":"OK"}</span><span className="text-[8px] text-zinc-600">{s.kind}</span></div><div className="mt-1 text-[10px] font-bold text-zinc-300">{s.title}</div><p className="mt-1 text-[9px] leading-4 text-zinc-500">{s.detail}</p></div>):<div className="rounded-xl border border-emerald-500/10 bg-emerald-500/5 p-3 text-[10px] text-emerald-300">Nessun punto critico rilevato. Puoi affrontare la settimana come programmato.</div>}</div>
  {report.signals.length>0&&<button className="secondary-cta mt-3 w-full" onClick={()=>{setExpanded(v=>!v);track("program_validation_toggled",{expanded:!expanded,signals:report.signals.length})}}>{expanded?"MOSTRA MENO":`MOSTRA ALTRI PUNTI · ${report.signals.length}`}</button>}
  {report.strengths.length>0&&<div className="mt-3 rounded-xl border border-emerald-500/10 bg-emerald-500/5 p-3"><div className="section-kicker text-emerald-300">PUNTI POSITIVI</div><div className="mt-2 grid gap-1">{report.strengths.map(x=><div key={x} className="text-[9px] text-zinc-400">{x}</div>)}</div></div>}
  <div className="mt-3 text-[8px] leading-4 text-zinc-600">Il controllo è indicativo: un avviso apre una revisione, non cambia automaticamente il programma.</div>
 </div>;
}'''

          text = text[:start] + new_validation + text[end:]
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/ux-effort-validation-refactor.yml
          git add src/main.tsx .github/workflows/ux-effort-validation-refactor.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: clarify weekly validation and restore effort buttons"
          git push
